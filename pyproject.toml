[tool.poetry]
name = "biolm_utils"
version = "0.0.3"
description = "Utilities and orchestration helpers for training and interpreting biolanguage models"
authors = ["dieterich-lab <noreply@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
accelerate = "0.31.0"
ferret-xai = "0.4.0"
hydra-core = ">=1.3.0"
omegaconf = ">=2.3.0"
pandas = "2.2.2"
tensorboard = "2.17.0"
torch = "2.3.1"
torchaudio = "2.3.1"
torchvision = "0.18.1"
transformers = "4.41.2"

[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-mock = "^3.15.1"
debugpy = "*"
torch-tb-profiler = "0.4.3"

[tool.poetry.group.mlflow]
optional = true

[tool.poetry.group.mlflow.dependencies]
mlflow = ">=2.0.0"

[tool.poetry.extras]
mlflow = ["mlflow"]

[tool.poetry.urls]
repository = "https://github.com/dieterich-lab/biolm_utils"

[tool.pyright]
typeCheckingMode = "off"

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
