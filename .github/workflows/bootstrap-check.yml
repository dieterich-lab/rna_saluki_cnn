name: Bootstrap smoke test

on:
  push:
    branches: [ main, refactor-config-management ]
  pull_request:
    branches: [ main ]

jobs:
  bootstrap-check:
    name: Verify `make bootstrap` (framework + plugin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Checkout framework repo (into ./biolm_utils)
        uses: actions/checkout@v4
        with:
          repository: dieterich-lab/biolm_utils
          ref: refactor-config-management
          path: biolm_utils

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Run Makefile bootstrap (use the checked-out framework)
        run: |
          # Use Makefile helper which creates a Poetry venv and installs the
          # framework + plugin into the same Poetry environment.
          make bootstrap FRAMEWORK_PATH=./biolm_utils

      - name: End-to-end smoke check — run the quick demo
        run: |
          poetry run python examples/quick_train_saluki.py
