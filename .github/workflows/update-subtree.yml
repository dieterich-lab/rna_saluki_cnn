name: Auto-update biolm_utils subtree

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update-subtree:
    name: Update biolm_utils subtree and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add biolm_upstream https://github.com/dieterich-lab/biolm_utils.git || true
          git fetch --all

      - name: Create update branch
        id: branch
        run: |
          export BRANCH=subtree/biolm-update-$(date +%Y%m%d%H%M)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

      - name: Pull upstream subtree (squash)
        run: |
          git fetch biolm_upstream main
          git subtree pull --prefix=biolm_utils biolm_upstream main --squash || true

      - name: Check for changes
        id: changes
        run: |
          echo "CHANGED=$(git status --porcelain)" > changed.txt
          grep -q "" changed.txt || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python for tests
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        if: steps.changes.outputs.has_changes == 'true'
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: poetry install

      - name: Run tests
        if: steps.changes.outputs.has_changes == 'true'
        run: poetry run pytest -q

      - name: Commit & push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore(subtree): update biolm_utils from upstream" || echo "No commit"
          git push origin HEAD

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore(subtree): update biolm_utils from upstream
          branch: ${{ steps.branch.outputs.branch }}
          base: refactor-config-management
          title: chore(subtree): update biolm_utils from upstream
          body: |
            This PR was created automatically by the scheduled update-subtree workflow. It updates the `biolm_utils` subtree to the latest `main` from upstream.
            
            Review and run tests before merging.
          labels: update, subtree
