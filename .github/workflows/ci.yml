name: CI

env:
  POETRY_VERSION: '2.1.3'

on:
  push:
    branches: [ main, saluki-2.0 ]
  pull_request:
    branches: [ main, saluki-2.0 ]

concurrency:
  group: saluki-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-sync:
    name: verify lockfile sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=${POETRY_VERSION} python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version

      - name: Verify poetry.lock is in sync with pyproject.toml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry check --lock

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry and dependencies
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=${POETRY_VERSION} python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version
          poetry config virtualenvs.in-project true --local || true
          poetry install --no-interaction --with dev

      - name: Run pre-commit hooks
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pre-commit run --all-files

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry and dependencies
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=${POETRY_VERSION} python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version
          poetry config virtualenvs.in-project true --local || true
          poetry install --no-interaction --with dev

      - name: Checkout BioLM framework
        uses: actions/checkout@v4
        with:
          repository: dieterich-lab/biolm_utils
          ref: biolm-2.0
          path: biolm_utils

      - name: Install BioLM framework and plugin editable
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pip install -e ./biolm_utils
          poetry run pip install -e .

      - name: Run plugin smoke tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q tests/test_saluki_plugin.py tests/test_saluki_plugin_config.py

      - name: Fail if deprecated config keys present
        run: |
          set -e
          if grep -R --line-number --exclude-dir .git -e '\blearningrate\b' .; then
            echo "Found deprecated 'learningrate' usage. Please migrate to 'learning_rate'."
            exit 1
          fi
