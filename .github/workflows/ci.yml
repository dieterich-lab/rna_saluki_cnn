name: CI

env:
  POETRY_VERSION: '2.1.3'
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

on:
  push:
    branches: [ main, saluki-2.0 ]
  pull_request:
    branches: [ main, saluki-2.0 ]

concurrency:
  group: saluki-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry and dependencies
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=${POETRY_VERSION} python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version
          poetry install --no-interaction --with dev

      - name: Checkout BioLM framework
        uses: actions/checkout@v4
        with:
          repository: dieterich-lab/biolm_utils
          ref: main
          path: biolm_utils

      - name: Provide legacy BioLM absolute path for Hydra
        run: |
          sudo mkdir -p /prj/RNA_NLP
          sudo ln -sfn "$GITHUB_WORKSPACE/biolm_utils" /prj/RNA_NLP/biolm_utils

      - name: Install BioLM framework and plugin editable
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pip install -e ./biolm_utils
          poetry run pip install -e .

      - name: Run saluki test suite
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q tests
