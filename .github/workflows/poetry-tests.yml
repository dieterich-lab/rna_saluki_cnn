name: poetry-tests

on:
  push:
    branches: [ main, saluki-2.0 ]
  pull_request:
    branches: [ main, saluki-2.0 ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version

      - name: Cache Poetry & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install (poetry)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry config virtualenvs.in-project true --local || true
          poetry install --no-interaction --with dev

      - name: Run tests (poetry)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Install dev deps
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry install --no-interaction --with dev
      - name: Run linters
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest -q --maxfail=1 --disable-warnings
