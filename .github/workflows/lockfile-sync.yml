name: lockfile-sync

on:
  pull_request:
    branches: [ main, saluki-2.0 ]
  push:
    branches: [ main, saluki-2.0 ]

jobs:
  poetry-lock-sync:
    name: Verify poetry.lock is in sync with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version

      - name: Verify lockfile
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Regenerate lockfile deterministically and fail if it changes.
          poetry lock --no-interaction

          # Fail if poetry.lock changed
          if [ -n "$(git status --porcelain --untracked-files=no -- poetry.lock)" ]; then
            echo "poetry.lock is out-of-sync with pyproject.toml. Run 'poetry lock' and commit the changed poetry.lock file." >&2
            git --no-pager diff --no-color --name-only -- poetry.lock || true
            exit 1
          fi
