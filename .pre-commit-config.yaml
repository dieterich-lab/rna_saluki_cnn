minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: pytest-saluki-plugin-smoke
        name: pytest saluki plugin smoke
        entry: poetry run python tools/prepush_plugin_smoke.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
